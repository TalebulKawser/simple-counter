<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalStorage Counter</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(147, 197, 253, 0.18);
        border-radius: 50%;
        top: -120px;
        left: -120px;
        filter: blur(20px);
        animation: floatOne 6s ease-in-out infinite alternate;
      }

      body::after {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        background: rgba(251, 191, 36, 0.15);
        border-radius: 50%;
        bottom: -100px;
        right: -100px;
        filter: blur(20px);
        animation: floatTwo 7s ease-in-out infinite alternate;
      }

      #header {
        position: relative;
        z-index: 1;
        color: #facc15 !important;
        font-family: "Trebuchet MS", Arial, sans-serif !important;
        font-size: 2.5rem;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 1px;
        text-shadow: 0 0 20px rgba(250, 204, 21, 0.45);
        animation: slideDown 0.8s ease forwards;
      }

      #count {
        position: relative;
        z-index: 1;
        width: 170px;
        height: 170px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 35px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        font-size: 4.5rem;
        font-weight: bold;
        color: #ffffff;
        box-shadow:
          0 0 30px rgba(96, 165, 250, 0.35),
          inset 0 0 25px rgba(255, 255, 255, 0.08);
        animation: pulse 2s infinite ease-in-out;
      }

      button {
        position: relative;
        z-index: 1;
        padding: 12px 22px;
        margin: 8px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #facc15, #fb923c);
        color: #111827;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(251, 146, 60, 0.35);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      button:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 14px 28px rgba(251, 146, 60, 0.5);
        background: linear-gradient(135deg, #fde047, #f97316);
      }

      button:active {
        transform: scale(0.95);
        box-shadow: 0 5px 12px rgba(251, 146, 60, 0.35);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow:
            0 0 30px rgba(96, 165, 250, 0.35),
            inset 0 0 25px rgba(255, 255, 255, 0.08);
        }

        50% {
          transform: scale(1.04);
          box-shadow:
            0 0 45px rgba(96, 165, 250, 0.55),
            inset 0 0 30px rgba(255, 255, 255, 0.12);
        }

        100% {
          transform: scale(1);
          box-shadow:
            0 0 30px rgba(96, 165, 250, 0.35),
            inset 0 0 25px rgba(255, 255, 255, 0.08);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-35px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes floatOne {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(70px, 60px);
        }
      }

      @keyframes floatTwo {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(-70px, -60px);
        }
      }

      @media (max-width: 600px) {
        #header {
          font-size: 1.8rem;
          padding: 0 20px;
        }

        #count {
          width: 140px;
          height: 140px;
          font-size: 3.5rem;
        }

        button {
          width: 120px;
          margin: 6px;
          padding: 11px 16px;
        }
      }
    </style>
  </head>

  <body>
    <h1 id="header" style="color: burlywood; font-family: monospace">
      A Counter with Reset and Save
    </h1>

    <h3 id="count">0</h3>

    <button onclick="increment()">+</button>
    <button onclick="decrement()">-</button>
    <button onclick="resetCounter()">Reset</button>
    <button onclick="saveCounter()">Save</button>
    <button onclick="loadCounter()">Load</button>
    <button onclick="removeCount()">Delete</button>

    <script>
      let count = 0;

      function showCount() {
        document.getElementById("count").innerHTML = count;
      }

      function increment() {
        count++;
        showCount();
      }
      function decrement() {
        count--;
        showCount();
      }
      function resetCounter() {
        count = 0;
        showCount();
      }
      function saveCounter() {
        localStorage.setItem("count", count);
      }
      function loadCounter() {
        let saved = localStorage.getItem("count");
        if (saved !== null) {
          count = Number(saved);
        }
        showCount();
      }

      function removeCount() {
        localStorage.removeItem("count");
        count = 0;
        showCount();
      }
    </script>
  </body>
</html>
